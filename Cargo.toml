[package]
authors = ["PatWie <mail@patwie.com>"]
description = "A pure Rust implementation of the Robot Operating System (ROS) core."
license = "MIT"
name = "ros-core-rs"
readme = "README.md"
repository = "https://github.com/patwie/ros-core-rs"
homepage = "https://github.com/patwie/ros-core-rs"
version = "0.2.6"
edition = "2021"
keywords = ["ros", "rosrust", "roscore", "robotics"]
categories = ["science::robotics"]

[dependencies]
dxr = { version = "0.8.0" }
dxr_server = { version = "0.8.0", features = ["axum", "multicall"] }
dxr_client = { version = "0.8.0", default-features = false, features = [
    "reqwest",
    "rustls-tls" # Use rustls instead of openssl for easier cross-compilation
] }
anyhow = "1.0.100"
log = "0.4.29"
env_logger = "0.11.8"
chrono = "0.4.43"
paste = "1.0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"]}
url = "2.5.8"
maplit = "1.0.2"
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v1", "rng"] }

[dev-dependencies]
rosrust = "0.9"
rosrust_msg = "0.1"
doc-comment = "0.3.4"
tokio = { version = "1", features = ["signal"]}
tokio-util = "0.7.18"

[features]
doctest = []
